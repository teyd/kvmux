[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
# "Unmaintained" notices for crates that gpui-kit pulls in. None is a vulnerability.
# Revisit when gpui-kit moves off them; a real vulnerability still fails CI.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, via gpui-kit" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, via gpui-kit" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, via gpui-kit" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, via gpui-kit" },
    # ddc-hi -> mccs-db parses only a YAML file bundled in the crate (include_bytes!). No monitor,
    # config or network data reaches serde_yaml. The ddc-hi tree is old; replace it eventually.
    { id = "RUSTSEC-2018-0005", reason = "serde_yaml 0.7: stack overflow on aliases, only bundled data is parsed" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust: unmaintained, via ddc-hi" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "bzip2-1.0.6",
    "Unlicense",
    # File-level copyleft: fine for dependencies we do not modify.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# fastframe is pinned by commit in Cargo.toml and reviewed by a human before every bump.
allow-git = ["https://github.com/crmne/fastframe"]
