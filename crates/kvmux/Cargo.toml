[package]
name = "kvmux"
description = "Switch monitor inputs when a USB device connects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
directories = "6"
fastframe-instance = { git = "https://github.com/crmne/fastframe", rev = "23d87e048185ef317f272e2a67416f516b2f2b04", version = "0.4.1" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", rev = "23d87e048185ef317f272e2a67416f516b2f2b04", version = "0.4.1" }
fastframe-update = { git = "https://github.com/crmne/fastframe", rev = "23d87e048185ef317f272e2a67416f516b2f2b04", version = "0.4.1", features = ["reqwest"] }
futures-channel = "0.3"
futures-lite = "2"
gpui-kit = "0.7.1"
kvmux-core = { path = "../kvmux-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
gpui-kit = { version = "0.7.1", features = ["test-support"] }
